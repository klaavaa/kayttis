<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jääkaappini</title>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #18302b;
      background: #f3f7f5;
    }

    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    h1 { margin-bottom: 4px; }
    h2 { font-size: 1.2rem; }

    .intro, .hint { color: #52635e; }

    .navigation {
      display: flex;
      gap: 8px;
      margin: 24px 0;
    }

    .navigation button {
      flex: 1;
      margin: 0;
      background: #e4eee9;
      color: #18302b;
    }

    .navigation button.active {
      background: #187a58;
      color: white;
    }

    [hidden] { display: none !important; }

    .panel, .product {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin: 16px 0;
      box-shadow: 0 2px 10px #18302b12;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 6px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      font: inherit;
      border-radius: 10px;
      padding: 12px;
    }

    input { border: 1px solid #b7c9c1; }

    button {
      border: 0;
      background: #187a58;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
    }

    .example-button {
      background: #e4eee9;
      color: #18302b;
    }

    .product {
      position: relative;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      border-left: 7px solid transparent;
    }

    .product.has-opened-badge { padding-right: 86px; }

    .product.expired-product {
      background: #ffd6d6;
      border-left-color: #c62828;
    }

    .product.soon-product {
      background: #ffe0bd;
      border-left-color: #df7600;
    }

    .product > img, .placeholder {
      width: 72px;
      height: 72px;
      flex: none;
      border-radius: 10px;
      object-fit: cover;
      background: #e7efeb;
    }

    .placeholder {
      display: grid;
      place-items: center;
      font-size: 2rem;
    }

    .details { flex: 1; min-width: 0; }
    .details strong { overflow-wrap: anywhere; }
    .details p { margin: 5px 0 0; color: #52635e; }

    .expired {
      color: #981e1e !important;
      font-weight: 700;
    }

    .soon {
      color: #8a4c00 !important;
      font-weight: 700;
    }

    .opened-date { color: #35564a !important; }

    .opened-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 2px solid #92b7a7;
      border-radius: 14px;
      background: white;
      box-shadow: 0 2px 8px #18302b20;
    }

    .opened-badge img {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .product-actions button {
      width: auto;
      margin: 0;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .secondary-button {
      background: #e4eee9;
      color: #18302b;
    }

    .delete {
      background: #eef2f0;
      color: #35443f;
      font-weight: 400;
    }

    .notifications {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 560px;
      max-height: min(65vh, 520px);
      margin: 0 auto;
      display: grid;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .notification {
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid #d5e7dd;
      border-radius: 20px;
      background: #ffffffee;
      box-shadow: 0 8px 24px #18302b30;
      backdrop-filter: blur(12px);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .notification-image {
      width: 52px;
      height: 52px;
      flex: none;
      border-radius: 12px;
      object-fit: cover;
      background: #e7efeb;
    }

    .notification-placeholder {
      display: grid;
      place-items: center;
      font-size: 1.6rem;
    }

    .notification-content { flex: 1; min-width: 0; }

    .notification-content strong {
      display: block;
      overflow-wrap: anywhere;
    }

    .notification-content p {
      margin: 4px 0 0;
      line-height: 1.4;
    }

    .notification-app {
      color: #52635e;
      font-size: 0.8rem;
    }

    .notification-close {
      width: 30px;
      height: 30px;
      flex: none;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      background: #e8eeeb;
      color: #35443f;
      font-size: 1.2rem;
      font-weight: 400;
    }

    #notice { font-weight: 600; }
  </style>
</head>

<body>
  <div
    id="notifications"
    class="notifications"
    aria-label="Päiväysilmoitukset"
  ></div>

  <h1>🥬 Jääkaappini</h1>
  <p class="intro">Seuraa jääkaapin tuotteita ja niiden päiväyksiä.</p>

  <nav class="navigation" aria-label="Näkymät">
    <button
      id="productsButton"
      type="button"
      class="active"
      aria-current="page"
    >
      Tuotteet
    </button>
    <button id="addButton" type="button">Lisää tuote</button>
  </nav>

  <main>
    <section id="productsView" aria-labelledby="productsHeading">
      <h2 id="productsHeading">Jääkaapin tuotteet</h2>
      <p id="notice" role="status"></p>
      <div id="products"></div>
    </section>

    <section id="addView" hidden aria-labelledby="addHeading">
      <div class="panel">
        <h2 id="addHeading">Lisää tuote käsin</h2>
        <p class="hint">
          Tämä näkymä simuloi prototyypissä kameran tekemää tuotteen lisäystä.
        </p>

        <form id="productForm">
          <label for="name">Tuotteen nimi</label>
          <input id="name" type="text" placeholder="Esim. maito" required />

          <label for="date">Päiväys</label>
          <input id="date" type="date" required />

          <label for="photo">Kuva (valinnainen)</label>
          <input id="photo" type="file" accept="image/*" />

          <button type="submit">Lisää jääkaappiin</button>
        </form>
      </div>

      <div class="panel">
        <h2>Kokeile esimerkkituotteilla</h2>
        <p class="hint">
          Lisää viisi tuotetta, joilla on erilaisia päiväyksiä ja
          avausmerkintöjä.
        </p>
        <button
          id="addExamplesButton"
          class="example-button"
          type="button"
        >
          Lisää 5 esimerkkituotetta
        </button>
      </div>
    </section>
  </main>

  <script>
    const storageKey = "jaakaappini-tuotteet";

    const productsView = document.querySelector("#productsView");
    const addView = document.querySelector("#addView");
    const productsButton = document.querySelector("#productsButton");
    const addButton = document.querySelector("#addButton");
    const addExamplesButton = document.querySelector("#addExamplesButton");
    const form = document.querySelector("#productForm");
    const productsElement = document.querySelector("#products");
    const noticeElement = document.querySelector("#notice");
    const notificationsElement = document.querySelector("#notifications");

    // Suljetut ilmoitukset pysyvät piilossa sivun uudelleenlataukseen asti.
    const dismissedNotifications = new Set();

    function showView(view) {
      const showingProducts = view === "products";

      productsView.hidden = !showingProducts;
      addView.hidden = showingProducts;

      productsButton.classList.toggle("active", showingProducts);
      addButton.classList.toggle("active", !showingProducts);

      if (showingProducts) {
        productsButton.setAttribute("aria-current", "page");
        addButton.removeAttribute("aria-current");
      } else {
        addButton.setAttribute("aria-current", "page");
        productsButton.removeAttribute("aria-current");
      }
    }

    productsButton.addEventListener("click", () => showView("products"));
    addButton.addEventListener("click", () => showView("add"));

    function loadProducts() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    let products = loadProducts();

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // Negatiivinen luku tarkoittaa mennyttä päivää.
    function dateWithOffset(offset) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + offset);
      return localDateString(date);
    }

    function exampleProducts() {
      return [
        {
          id: "esimerkki-maito",
          name: "Maito",
          date: dateWithOffset(-2),
          photo: null,
          openedAt: dateWithOffset(-4)
        },
        {
          id: "esimerkki-jogurtti",
          name: "Jogurtti",
          date: dateWithOffset(1),
          photo: null,
          openedAt: null
        },
        {
          id: "esimerkki-juusto",
          name: "Juusto",
          date: dateWithOffset(3),
          photo: null,
          openedAt: dateWithOffset(-2)
        },
        {
          id: "esimerkki-kurkkusalaatti",
          name: "Kurkkusalaatti",
          date: dateWithOffset(10),
          photo: null,
          openedAt: dateWithOffset(-1)
        },
        {
          id: "esimerkki-kananmunat",
          name: "Kananmunat",
          date: dateWithOffset(14),
          photo: null,
          openedAt: null
        }
      ];
    }

    function daysUntil(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      const today = new Date();

      const todayUTC = Date.UTC(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
      );
      const productUTC = Date.UTC(year, month - 1, day);

      return Math.round((productUTC - todayUTC) / 86400000);
    }

    function openedText(openedAt) {
      const daysAgo = -daysUntil(openedAt);

      if (daysAgo === 0) return "Avattu tänään";
      if (daysAgo === 1) return "Avattu 1 päivä sitten";
      return `Avattu ${daysAgo} päivää sitten`;
    }

    function statusText(days) {
      if (days < 0) return `Päiväys meni ${-days} pv sitten`;
      if (days === 0) return "Päiväys on tänään";
      if (days === 1) return "Päiväys on huomenna";
      return `Päiväykseen ${days} pv`;
    }

    function notificationMessage(product) {
      const days = daysUntil(product.date);

      if (days < 0) {
        const daysAgo = -days;
        return `Päiväys meni vanhaksi ${daysAgo} ${
          daysAgo === 1 ? "päivä" : "päivää"
        } sitten.`;
      }

      if (days === 0) return "Päiväys on tänään.";
      if (days === 1) return "Päiväys on huomenna.";
      return `Päiväykseen on ${days} päivää.`;
    }

    // Pienennetään kamerasta tai galleriasta valittu kuva ennen tallennusta.
    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const objectUrl = URL.createObjectURL(file);

        image.onload = () => {
          try {
            const maxSize = 300;
            const scale = Math.min(
              1,
              maxSize / Math.max(image.width, image.height)
            );

            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));

            const context = canvas.getContext("2d");
            if (!context) {
              throw new Error("Kuvan käsittely epäonnistui.");
            }

            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.45));
          } catch (error) {
            reject(error);
          } finally {
            URL.revokeObjectURL(objectUrl);
          }
        };

        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Kuvaa ei voitu lukea."));
        };

        image.src = objectUrl;
      });
    }

    function createProductImage(product, forNotification = false) {
      if (product.photo) {
        const image = document.createElement("img");
        image.src = product.photo;
        image.alt = `Kuva tuotteesta ${product.name}`;

        if (forNotification) image.className = "notification-image";
        return image;
      }

      const placeholder = document.createElement("div");
      placeholder.className = forNotification
        ? "notification-image notification-placeholder"
        : "placeholder";
      placeholder.setAttribute("aria-hidden", "true");
      placeholder.textContent = "🥫";
      return placeholder;
    }

    function saveProducts(updated) {
      localStorage.setItem(storageKey, JSON.stringify(updated));
      products = updated;
      render();
    }

    function renderNotifications() {
      notificationsElement.replaceChildren();

      const urgent = [...products]
        .filter(product => daysUntil(product.date) <= 3)
        .filter(product => !dismissedNotifications.has(product.id))
        .sort((a, b) => a.date.localeCompare(b.date));

      for (const product of urgent) {
        const card = document.createElement("article");
        card.className = "notification";

        const content = document.createElement("div");
        content.className = "notification-content";

        const appName = document.createElement("span");
        appName.className = "notification-app";
        appName.textContent = "JÄÄKAAPPINI · NYT";

        const title = document.createElement("strong");
        title.textContent = product.name;

        const message = document.createElement("p");
        message.textContent = notificationMessage(product);

        content.append(appName, title, message);

        const closeButton = document.createElement("button");
        closeButton.className = "notification-close";
        closeButton.type = "button";
        closeButton.textContent = "×";
        closeButton.setAttribute(
          "aria-label",
          `Sulje tuotteen ${product.name} ilmoitus`
        );

        closeButton.addEventListener("click", () => {
          dismissedNotifications.add(product.id);
          card.remove();
        });

        card.append(
          createProductImage(product, true),
          content,
          closeButton
        );

        notificationsElement.append(card);
      }
    }

    function renderProducts() {
      productsElement.replaceChildren();

      const sorted = [...products].sort((a, b) =>
        a.date.localeCompare(b.date)
      );

      const urgentCount = sorted.filter(
        product => daysUntil(product.date) <= 3
      ).length;

      noticeElement.textContent = urgentCount
        ? `🔔 ${urgentCount} tuotteen päiväys on mennyt tai lähestyy 3 päivän sisällä.`
        : "Ei pian vanhenevia tuotteita.";

      if (sorted.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "Jääkaappi on vielä tyhjä.";
        productsElement.append(empty);
        return;
      }

      for (const product of sorted) {
        const days = daysUntil(product.date);
        const card = document.createElement("article");
        card.className = "product";

        if (days < 0) {
          card.classList.add("expired-product");
        } else if (days <= 3) {
          card.classList.add("soon-product");
        }

        if (product.openedAt) {
          card.classList.add("has-opened-badge");
        }

        const details = document.createElement("div");
        details.className = "details";

        const name = document.createElement("strong");
        name.textContent = product.name;

        const date = document.createElement("p");
        date.textContent = `${product.date} · ${statusText(days)}`;

        if (days < 0) date.className = "expired";
        else if (days <= 3) date.className = "soon";

        details.append(name, date);

        if (product.openedAt) {
          const opened = document.createElement("p");
          opened.className = "opened-date";
          opened.textContent = openedText(product.openedAt);
          details.append(opened);
        }

        const actions = document.createElement("div");
        actions.className = "product-actions";

        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.className = product.openedAt ? "secondary-button" : "";
        openButton.textContent = product.openedAt
          ? "Peru avaus"
          : "Merkitse avatuksi";
        openButton.setAttribute(
          "aria-label",
          product.openedAt
            ? `Peru tuotteen ${product.name} avausmerkintä`
            : `Merkitse ${product.name} avatuksi`
        );

        openButton.addEventListener("click", () => {
          const updated = products.map(item =>
            item.id === product.id
              ? {
                  ...item,
                  openedAt: item.openedAt ? null : localDateString()
                }
              : item
          );

          try {
            saveProducts(updated);
          } catch (error) {
            alert(`Avausmerkintää ei voitu tallentaa: ${error.message}`);
          }
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.type = "button";
        deleteButton.textContent = "Poista";
        deleteButton.setAttribute("aria-label", `Poista ${product.name}`);

        deleteButton.addEventListener("click", () => {
          const updated = products.filter(item => item.id !== product.id);

          try {
            saveProducts(updated);
          } catch (error) {
            alert(`Tuotetta ei voitu poistaa: ${error.message}`);
          }
        });

        actions.append(openButton, deleteButton);
        details.append(actions);
        card.append(createProductImage(product), details);

        if (product.openedAt) {
          const badge = document.createElement("span");
          badge.className = "opened-badge";
          badge.title = "Tuote on avattu";

          const openedImage = document.createElement("img");
          openedImage.src = "avattu-purkki.png";
          openedImage.alt = "Tuote on avattu";

          badge.append(openedImage);
          card.append(badge);
        }

        productsElement.append(card);
      }
    }

    function render() {
      renderProducts();
      renderNotifications();
    }

    addExamplesButton.addEventListener("click", () => {
      const existingIds = new Set(products.map(product => product.id));
      const missingExamples = exampleProducts().filter(
        product => !existingIds.has(product.id)
      );

      if (missingExamples.length === 0) {
        alert("Kaikki viisi esimerkkituotetta on jo lisätty.");
        return;
      }

      try {
        saveProducts([...products, ...missingExamples]);
        showView("products");
      } catch (error) {
        alert(
          `Esimerkkituotteita ei voitu tallentaa: ${
            error?.message || "tuntematon virhe"
          }`
        );
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      try {
        const file = document.querySelector("#photo").files[0];

        const product = {
          id: `tuote-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          name: document.querySelector("#name").value.trim(),
          date: document.querySelector("#date").value,
          photo: file ? await resizeImage(file) : null,
          openedAt: null
        };

        saveProducts([...products, product]);
        form.reset();
        showView("products");
      } catch (error) {
        if (error?.name === "QuotaExceededError") {
          alert(
            "Selaimen tallennustila on täynnä. Poista muutama vanha kuvallinen tuote tai lisää tuote ilman kuvaa."
          );
        } else {
          alert(
            `Tuotetta ei voitu tallentaa: ${
              error?.message || "tuntematon virhe"
            }`
          );
        }
      }
    });

    render();
  </script>
</body>
</html>
